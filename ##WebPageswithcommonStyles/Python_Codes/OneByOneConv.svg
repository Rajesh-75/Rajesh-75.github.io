<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">1&#215;1 Convolution: Channel-Only Mixing</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#64748b">Same spatial location (i, j) throughout &#8212; no neighboring pixels are ever involved</text>

  <!-- ===== INPUT STACK ===== -->
  <text x="140" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Input pixel (i,j)</text>
  <text x="140" y="108" text-anchor="middle" font-size="12" fill="#64748b">across C_in = 4 channels</text>

  <g>
    <rect x="100" y="120" width="80" height="46" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="140" y="148" text-anchor="middle" font-size="14" fill="#1e3a8a">C1 = 2</text>

    <rect x="108" y="172" width="80" height="46" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="148" y="200" text-anchor="middle" font-size="14" fill="#1e3a8a">C2 = 5</text>

    <rect x="116" y="224" width="80" height="46" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="156" y="252" text-anchor="middle" font-size="14" fill="#1e3a8a">C3 = 1</text>

    <rect x="124" y="276" width="80" height="46" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="164" y="304" text-anchor="middle" font-size="14" fill="#1e3a8a">C4 = 3</text>
  </g>
  <text x="150" y="345" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">1&#215;1&#215;4 depth column</text>

  <!-- ===== FILTER 1 (orange) LANE ===== -->
  <path d="M 210 190 C 260 190, 260 145, 320 145" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <rect x="325" y="105" width="220" height="80" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="435" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">Filter 1 (1&#215;1&#215;4 &#8594; 1)</text>
  <text x="435" y="144" text-anchor="middle" font-size="11" fill="#7c2d12">weights: [0.5, -0.2, 1.0, 0.3], b=0</text>
  <text x="435" y="163" text-anchor="middle" font-size="11" fill="#7c2d12">0.5(2) - 0.2(5) + 1.0(1) + 0.3(3)</text>
  <text x="435" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">= 1.9</text>

  <path d="M 545 145 L 610 145" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <rect x="615" y="120" width="90" height="50" rx="4" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
  <text x="660" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">1.9</text>

  <!-- ===== FILTER 2 (teal) LANE ===== -->
  <path d="M 210 260 C 260 260, 260 305, 320 305" stroke="#0d9488" stroke-width="2" fill="none" marker-end="url(#arrowTeal)"/>
  <rect x="325" y="265" width="220" height="80" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="435" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">Filter 2 (1&#215;1&#215;4 &#8594; 1)</text>
  <text x="435" y="304" text-anchor="middle" font-size="11" fill="#134e4a">weights: [0.1, 0.4, -0.5, 0.2], b=0.1</text>
  <text x="435" y="323" text-anchor="middle" font-size="11" fill="#134e4a">0.1(2)+0.4(5)-0.5(1)+0.2(3)+0.1</text>
  <text x="435" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">= 2.4</text>

  <path d="M 545 305 L 610 305" stroke="#0d9488" stroke-width="2" fill="none" marker-end="url(#arrowTeal)"/>
  <rect x="615" y="280" width="90" height="50" rx="4" fill="#5eead4" stroke="#0f766e" stroke-width="1.5"/>
  <text x="660" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">2.4</text>

  <!-- ===== OUTPUT STACK ===== -->
  <path d="M 705 145 C 750 145, 750 205, 750 205" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M 705 305 C 750 305, 750 245, 750 245" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <rect x="760" y="195" width="90" height="46" rx="4" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
  <text x="805" y="223" text-anchor="middle" font-size="13" fill="#7c2d12">1.9</text>
  <rect x="768" y="240" width="90" height="46" rx="4" fill="#5eead4" stroke="#0f766e" stroke-width="1.5"/>
  <text x="813" y="268" text-anchor="middle" font-size="13" fill="#134e4a">2.4</text>

  <text x="805" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Output pixel (i,j)</text>
  <text x="805" y="320" text-anchor="middle" font-size="12" fill="#64748b">across C_out = 2 channels</text>

  <!-- Key takeaway -->
  <rect x="60" y="375" width="780" height="52" rx="6" fill="#eef6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="450" y="397" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Channel count changed (4 &#8594; 2) &#8212; spatial size did NOT.</text>
  <text x="450" y="415" text-anchor="middle" font-size="12" fill="#1e3a8a">Repeating this same dot-product at every (i,j) position produces a full H&#215;W&#215;2 output volume, with zero pixels mixed spatially.</text>

  <!-- ===== BOTTOM COMPARISON STRIP ===== -->
  <text x="450" y="455" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Compare the Filter's Footprint</text>

  <!-- 3x3 conv footprint -->
  <text x="230" y="480" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">A 3&#215;3 filter's footprint</text>
  <g transform="translate(140,495)">
    <g>
      <rect x="0" y="0" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
      <rect x="30" y="0" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
      <rect x="60" y="0" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
      <rect x="0" y="30" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
      <rect x="30" y="30" width="30" height="30" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
      <rect x="60" y="30" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
      <rect x="0" y="60" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
      <rect x="30" y="60" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
      <rect x="60" y="60" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
      <rect x="-2" y="-2" width="94" height="94" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    </g>
  </g>
  <text x="230" y="612" text-anchor="middle" font-size="11" fill="#64748b">Uses 8 neighboring pixels + the center</text>

  <!-- 1x1 conv footprint -->
  <text x="670" y="480" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">A 1&#215;1 filter's footprint</text>
  <g transform="translate(580,495)">
    <rect x="0" y="0" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
    <rect x="30" y="0" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
    <rect x="60" y="0" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
    <rect x="0" y="30" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
    <rect x="30" y="30" width="30" height="30" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <rect x="60" y="30" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
    <rect x="0" y="60" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
    <rect x="30" y="60" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
    <rect x="60" y="60" width="30" height="30" fill="#eef2f7" stroke="#cbd5e1"/>
    <rect x="28" y="28" width="34" height="34" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <text x="670" y="612" text-anchor="middle" font-size="11" fill="#64748b">Uses only the center pixel &#8212; neighbors ignored</text>

  <!-- Arrow marker defs -->
  <defs>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f97316"/>
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0d9488"/>
    </marker>
  </defs>
</svg>
