<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">ResNet-50 Applied to Chest X-Ray Diagnosis</text>
  <text x="500" y="46" text-anchor="middle" font-size="12" fill="#64748b">A concrete pipeline: the residual blocks from Figure 6, stacked and repeated, doing real diagnostic work</text>

  <!-- Input -->
  <rect x="18" y="150" width="110" height="100" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="30" y="162" width="86" height="76" rx="4" fill="#0f172a"/>
  <ellipse cx="58" cy="200" rx="14" ry="26" fill="#334155"/>
  <ellipse cx="88" cy="200" rx="14" ry="26" fill="#334155"/>
  <text x="73" y="264" text-anchor="middle" font-size="10.5" fill="#334155">Chest X-Ray</text>
  <text x="73" y="277" text-anchor="middle" font-size="9.5" fill="#64748b">1&#215;224&#215;224</text>

  <path d="M128,200 L152,200" stroke="#475569" stroke-width="2" marker-end="url(#arrowG3)"/>

  <!-- Stem -->
  <rect x="154" y="170" width="70" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="189" y="196" text-anchor="middle" font-size="10" fill="#334155">7&#215;7 Conv</text>
  <text x="189" y="209" text-anchor="middle" font-size="10" fill="#334155">+ Pool</text>
  <text x="189" y="222" text-anchor="middle" font-size="9" fill="#64748b">64ch, 56&#178;</text>

  <path d="M224,200 L248,200" stroke="#475569" stroke-width="2" marker-end="url(#arrowG3)"/>

  <!-- Stage 1 -->
  <g>
    <rect x="250" y="160" width="90" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M270,172 a10,10 0 1,1 -0.5,0" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlueSm)"/>
    <text x="295" y="178" font-size="9" fill="#1e3a8a">&#215;3 blocks</text>
    <text x="295" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Stage 1</text>
    <text x="295" y="220" text-anchor="middle" font-size="9.5" fill="#1e3a8a">256ch, 56&#178;</text>
  </g>
  <path d="M340,200 L364,200" stroke="#475569" stroke-width="2" marker-end="url(#arrowG3)"/>

  <!-- Stage 2 -->
  <g>
    <rect x="366" y="163" width="86" height="74" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M384,174 a9,9 0 1,1 -0.4,0" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlueSm)"/>
    <text x="410" y="180" font-size="9" fill="#1e3a8a">&#215;4</text>
    <text x="409" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Stage 2</text>
    <text x="409" y="220" text-anchor="middle" font-size="9.5" fill="#1e3a8a">512ch, 28&#178;</text>
  </g>
  <path d="M452,200 L476,200" stroke="#475569" stroke-width="2" marker-end="url(#arrowG3)"/>

  <!-- Stage 3 -->
  <g>
    <rect x="478" y="166" width="82" height="68" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M494,176 a8,8 0 1,1 -0.35,0" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlueSm)"/>
    <text x="519" y="182" font-size="9" fill="#1e3a8a">&#215;6</text>
    <text x="519" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Stage 3</text>
    <text x="519" y="220" text-anchor="middle" font-size="9.5" fill="#1e3a8a">1024ch, 14&#178;</text>
  </g>
  <path d="M560,200 L584,200" stroke="#475569" stroke-width="2" marker-end="url(#arrowG3)"/>

  <!-- Stage 4 -->
  <g>
    <rect x="586" y="169" width="78" height="62" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M600,178 a7,7 0 1,1 -0.3,0" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlueSm)"/>
    <text x="625" y="184" font-size="9" fill="#1e3a8a">&#215;3</text>
    <text x="625" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Stage 4</text>
    <text x="625" y="220" text-anchor="middle" font-size="9.5" fill="#1e3a8a">2048ch, 7&#178;</text>
  </g>

  <text x="457" y="300" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">Every stage is a repeated run of the bottleneck block from Figure 6 &#8212; spatial size shrinks, channel depth grows, diagnostic detail accumulates</text>

  <path d="M664,200 L688,200" stroke="#475569" stroke-width="2" marker-end="url(#arrowG3)"/>

  <!-- GAP -->
  <rect x="690" y="178" width="72" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="726" y="197" text-anchor="middle" font-size="9.5" fill="#166534">Global Avg</text>
  <text x="726" y="210" text-anchor="middle" font-size="9.5" fill="#166534">Pool</text>

  <path d="M762,200 L786,200" stroke="#475569" stroke-width="2" marker-end="url(#arrowG3)"/>

  <!-- FC + Softmax -->
  <rect x="788" y="178" width="80" height="44" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="828" y="197" text-anchor="middle" font-size="9.5" fill="#713f12">FC + Softmax</text>
  <text x="828" y="210" text-anchor="middle" font-size="9" fill="#713f12">(2048&#8594;3 classes)</text>

  <path d="M868,200 L892,200" stroke="#475569" stroke-width="2" marker-end="url(#arrowG3)"/>

  <!-- Output bars -->
  <text x="940" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Diagnosis</text>
  <text x="892" y="172" font-size="9.5" fill="#334155">Pneumonia</text>
  <rect x="892" y="176" width="70" height="12" rx="2" fill="#fecaca"/>
  <rect x="892" y="176" width="61" height="12" rx="2" fill="#dc2626"/>
  <text x="967" y="186" font-size="9.5" fill="#7f1d1d">87%</text>

  <text x="892" y="200" font-size="9.5" fill="#334155">Normal</text>
  <rect x="892" y="204" width="70" height="12" rx="2" fill="#bbf7d0"/>
  <rect x="892" y="204" width="6" height="12" rx="2" fill="#16a34a"/>
  <text x="967" y="214" font-size="9.5" fill="#166534">9%</text>

  <text x="892" y="228" font-size="9.5" fill="#334155">Other</text>
  <rect x="892" y="232" width="70" height="12" rx="2" fill="#e2e8f0"/>
  <rect x="892" y="232" width="3" height="12" rx="2" fill="#64748b"/>
  <text x="967" y="242" font-size="9.5" fill="#475569">4%</text>

  <!-- Transfer learning callout -->
  <rect x="40" y="320" width="920" height="90" rx="8" fill="#eef6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Why This Pipeline Is Realistic, Not Just Illustrative</text>
  <text x="500" y="366" text-anchor="middle" font-size="11.5" fill="#1e3a8a">This ResNet-50 is rarely trained from scratch on medical data &#8212; it is pretrained on ImageNet, then</text>
  <text x="500" y="384" text-anchor="middle" font-size="11.5" fill="#1e3a8a">fine-tuned on a much smaller labeled X-ray dataset. The bottleneck block's parameter efficiency (Figure 6)</text>
  <text x="500" y="402" text-anchor="middle" font-size="11.5" fill="#1e3a8a">is exactly what makes that practical &#8212; far fewer weights need to be re-learned from scarce clinical data.</text>

  <defs>
    <marker id="arrowG3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlueSm" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
