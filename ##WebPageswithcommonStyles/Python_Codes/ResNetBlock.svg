<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Residual Block: Identity Shortcut + Learned Correction</text>
  <line x1="450" y1="45" x2="450" y2="400" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===================== PANEL A: BASIC BLOCK ===================== -->
  <text x="230" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Basic Residual Block</text>

  <rect x="185" y="80" width="90" height="34" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="102" text-anchor="middle" font-size="13" fill="#1e293b">x</text>

  <path d="M230,114 L230,134" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="150" y="136" width="160" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="230" y="159" text-anchor="middle" font-size="12" fill="#1e3a8a">3&#215;3 Conv + ReLU</text>

  <path d="M230,172 L230,192" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="150" y="194" width="160" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="230" y="217" text-anchor="middle" font-size="12" fill="#1e3a8a">3&#215;3 Conv</text>
  <text x="230" y="244" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">output = F(x)</text>

  <!-- identity skip bypass -->
  <path d="M275,97 L330,97 L330,270 L263,270" stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#arrowTealSm)"/>
  <text x="332" y="185" font-size="11" fill="#0f766e" transform="rotate(90 332 185)">identity shortcut (x)</text>

  <path d="M230,230 L230,255" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <circle cx="230" cy="270" r="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="230" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">+</text>

  <path d="M230,286 L230,306" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="185" y="308" width="90" height="32" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="230" y="329" text-anchor="middle" font-size="12" fill="#7f1d1d">ReLU</text>

  <path d="M230,340 L230,360" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="230" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">H(x) = F(x) + x</text>

  <!-- ===================== PANEL B: BOTTLENECK BLOCK ===================== -->
  <text x="670" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Bottleneck Residual Block</text>

  <rect x="625" y="80" width="90" height="34" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="670" y="102" text-anchor="middle" font-size="13" fill="#1e293b">x (256ch)</text>

  <path d="M670,114 L670,132" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="590" y="134" width="160" height="30" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="670" y="153" text-anchor="middle" font-size="11" fill="#7c2d12">1&#215;1 Conv (reduce &#8594; 64ch)</text>

  <path d="M670,164 L670,182" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="590" y="184" width="160" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="670" y="203" text-anchor="middle" font-size="11" fill="#1e3a8a">3&#215;3 Conv (64&#8594;64ch)</text>

  <path d="M670,214 L670,232" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="590" y="234" width="160" height="30" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="670" y="253" text-anchor="middle" font-size="11" fill="#7c2d12">1&#215;1 Conv (expand &#8594; 256ch)</text>
  <text x="670" y="272" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">output = F(x)</text>

  <!-- identity skip bypass -->
  <path d="M715,97 L770,97 L770,290 L703,290" stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#arrowTealSm)"/>
  <text x="772" y="200" font-size="11" fill="#0f766e" transform="rotate(90 772 200)">identity shortcut (x)</text>

  <path d="M670,264 L670,285" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <circle cx="670" cy="300" r="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="670" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">+</text>

  <path d="M670,316 L670,336" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="625" y="338" width="90" height="30" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="670" y="358" text-anchor="middle" font-size="12" fill="#7f1d1d">ReLU</text>

  <path d="M670,368 L670,388" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="670" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">H(x) = F(x) + x</text>
  <text x="670" y="422" text-anchor="middle" font-size="10.5" fill="#64748b">(cheaper than three 256-wide 3&#215;3 convs)</text>

  <!-- ===================== SHARED GRADIENT CALLOUT ===================== -->
  <rect x="60" y="440" width="780" height="100" rx="8" fill="#eef6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="466" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Why the Identity Shortcut Fixes Training (Not Just Accuracy)</text>
  <text x="450" y="492" text-anchor="middle" font-size="15" fill="#1e3a8a">&#8706;L/&#8706;x&#160;=&#160;&#8706;L/&#8706;H&#160;&#215;&#160;(&#8706;F/&#8706;x&#160;+</text>
  <rect x="580" y="479" width="26" height="20" rx="4" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
  <text x="593" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">1</text>
  <text x="608" y="492" font-size="15" fill="#1e3a8a">)</text>
  <text x="450" y="516" text-anchor="middle" font-size="12" fill="#1e3a8a">That highlighted "+1" guarantees a direct gradient path through every block, no matter how small &#8706;F/&#8706;x becomes &#8212;</text>
  <text x="450" y="533" text-anchor="middle" font-size="12" fill="#1e3a8a">this is exactly what lets ResNets train at 50&#8211;150+ layers where plain conv stacks degrade.</text>

  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arrowTealSm" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#0d9488"/>
    </marker>
  </defs>
</svg>
