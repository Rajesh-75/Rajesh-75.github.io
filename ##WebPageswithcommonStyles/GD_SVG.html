<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background / 3D Grid Floor -->
  <rect width="400" height="300" fill="#f8f9fa" />
  
  <!-- 3D Axes -->
  <line x1="200" y1="280" x2="200" y2="50" stroke="#ccc" stroke-width="2" /> <!-- Z-Axis -->
  <line x1="200" y1="220" x2="350" y2="270" stroke="#ccc" stroke-width="2" /> <!-- X-Axis -->
  <line x1="200" y1="220" x2="50" y2="270" stroke="#ccc" stroke-width="2" />  <!-- Y-Axis -->

  <!-- Parabolic Surface (Bowl) with Shading -->
  <defs>
    <radialGradient id="bowlGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0.6" />
    </radialGradient>
  </defs>
  
  <!-- Surface Contours (Perspective Ellipses) -->
  <ellipse cx="200" cy="120" rx="140" ry="60" fill="url(#bowlGradient)" stroke="#2980b9" stroke-width="1" />
  <ellipse cx="200" cy="150" rx="100" ry="45" fill="none" stroke="#2980b9" stroke-opacity="0.5" stroke-width="1" />
  <ellipse cx="200" cy="180" rx="60" ry="25" fill="none" stroke="#2980b9" stroke-opacity="0.5" stroke-width="1" />
  <ellipse cx="200" cy="205" rx="20" ry="8" fill="none" stroke="#2980b9" stroke-opacity="0.8" stroke-width="1" />

  <!-- Gradient Descent Path -->
  <!-- Start point (High loss) to End point (Minimum) -->
  <path d="M 310 100 Q 280 180, 205 210" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,2" />
  
  <!-- Iteration Points -->
  <circle cx="310" cy="100" r="4" fill="#e74c3c" /> <!-- Step 0 -->
  <circle cx="275" cy="155" r="3.5" fill="#e74c3c" /> <!-- Step 1 -->
  <circle cx="245" cy="185" r="3" fill="#e74c3c" /> <!-- Step 2 -->
  <circle cx="220" cy="200" r="2.5" fill="#e74c3c" /> <!-- Step 3 -->
  <circle cx="205" cy="210" r="4" fill="#2ecc71" /> <!-- Minimum -->

  <!-- Labels -->
  <text x="315" y="95" font-family="Arial" font-size="12" fill="#e74c3c">Start (High Loss)</text>
  <text x="175" y="235" font-family="Arial" font-size="12" fill="#27ae60">Minimum</text>
  <text x="210" y="60" font-family="Arial" font-size="14" font-weight="bold" fill="#34495e">Loss Surface J(w1, w2)</text>
</svg>
