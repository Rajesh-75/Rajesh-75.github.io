<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowVO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- ============ INPUT VOLUME (Blue back, Green middle, Red front) ============ -->
  <g>
    <!-- Blue plane -->
    <g transform="translate(60,70)">
      <polygon points="0,150 130,150 160,120 160,-20 30,-20 0,10" fill="#5dade2" stroke="#1b4f72" stroke-width="1.3"/>
      <polygon points="0,10 30,-20 160,-20 130,10" fill="#85c1e9" stroke="#1b4f72" stroke-width="1.3"/>
      <path d="M52,-20 L52,120 M104,-20 L104,120 M0,36 L130,36 M0,63 L130,63 M0,90 L130,90 M0,117 L130,117" stroke="#2e86c1" stroke-width="0.6" transform="translate(0,10)"/>
    </g>
    <!-- Green plane -->
    <g transform="translate(42,88)">
      <polygon points="0,150 130,150 160,120 160,-20 30,-20 0,10" fill="#7dcea0" stroke="#186a3b" stroke-width="1.3"/>
      <polygon points="0,10 30,-20 160,-20 130,10" fill="#a9dfbf" stroke="#186a3b" stroke-width="1.3"/>
      <g font-size="9.5" fill="#0b3d20">
        <text x="15" y="30">5</text><text x="45" y="30">6</text><text x="75" y="30">2</text><text x="105" y="30">4</text>
        <text x="15" y="57">6</text><text x="45" y="57">2</text><text x="75" y="57">4</text><text x="105" y="57">0</text>
      </g>
    </g>
    <!-- Red plane (front) with actual sample pixel values -->
    <g transform="translate(24,106)">
      <polygon points="0,150 130,150 160,120 160,-20 30,-20 0,10" fill="#ec7063" stroke="#78281f" stroke-width="1.3"/>
      <polygon points="0,10 30,-20 160,-20 130,10" fill="#f5b7b1" stroke="#78281f" stroke-width="1.3"/>
      <path d="M32,-20 V120 M64,-20 V120 M96,-20 V120 M128,-20 V120 M0,34 H160 M0,64 H160 M0,94 H160 M0,124 H160" transform="translate(0,10)" stroke="#c0392b" stroke-width="0.5"/>
      <g font-size="10.5" fill="#4a0f0a" text-anchor="middle">
        <text x="16" y="30">4</text><text x="48" y="30">9</text><text x="80" y="30">2</text><text x="112" y="30">5</text><text x="144" y="30">8</text>
        <text x="16" y="60">5</text><text x="48" y="60">6</text><text x="80" y="60">2</text><text x="112" y="60">4</text><text x="144" y="60">0</text>
        <text x="16" y="90">2</text><text x="48" y="90">4</text><text x="80" y="90">5</text><text x="112" y="90">4</text><text x="144" y="90">5</text>
        <text x="16" y="120">5</text><text x="48" y="120">7</text><text x="80" y="120">7</text><text x="112" y="120">9</text><text x="144" y="120">2</text>
      </g>
      <!-- start position highlight -->
      <rect x="1" y="11" width="31" height="31" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    </g>
    <line x1="10" y1="65" x2="26" y2="120" stroke="#333" stroke-width="1.3" marker-end="url(#arrowVO)"/>
    <text x="-4" y="60" font-size="12" fill="#333">Start</text>
    <text x="-14" y="74" font-size="12" fill="#333">position</text>

    <text x="90" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Input: 32 x 32 x 3 (RGB)</text>
  </g>

  <!-- convolution operator -->
  <text x="255" y="230" font-size="26" font-weight="bold" fill="#111">*</text>

  <!-- ============ FILTER 1: Vertical Edge Detector ============ -->
  <text x="330" y="55" font-size="14" font-weight="bold" fill="#111">Filter 1: 3 x 3 x 3</text>
  <text x="330" y="72" font-size="13" fill="#333">(Vertical Edge Detector)</text>
  <g transform="translate(300,90)">
    <g transform="translate(24,0)">
      <rect width="90" height="90" fill="#a3e4d7" stroke="#0e6655" stroke-width="1.3"/>
      <path d="M30,0 V90 M60,0 V90 M0,30 H90 M0,60 H90" stroke="#0e6655" stroke-width="0.6"/>
    </g>
    <g transform="translate(12,10)">
      <rect width="90" height="90" fill="#a3e4d7" stroke="#0e6655" stroke-width="1.3"/>
      <path d="M30,0 V90 M60,0 V90 M0,30 H90 M0,60 H90" stroke="#0e6655" stroke-width="0.6"/>
    </g>
    <g transform="translate(0,20)">
      <rect width="90" height="90" fill="#a3e4d7" stroke="#0e6655" stroke-width="1.3"/>
      <path d="M30,0 V90 M60,0 V90 M0,30 H90 M0,60 H90" stroke="#0e6655" stroke-width="0.6"/>
      <g font-size="13" fill="#0b3d2e" text-anchor="middle" font-weight="600">
        <text x="15" y="20">-1</text><text x="45" y="20">0</text><text x="75" y="20">1</text>
        <text x="15" y="50">-2</text><text x="45" y="50">0</text><text x="75" y="50">2</text>
        <text x="15" y="80">-1</text><text x="45" y="80">0</text><text x="75" y="80">1</text>
      </g>
    </g>
  </g>
  <text x="345" y="235" font-size="12.5" fill="#333">Filter 1: 3x3x3</text>
  <text x="345" y="250" font-size="12.5" fill="#333">(Vertical Edge Detector)</text>

  <!-- ============ FILTER 2: Horizontal Edge Detector ============ -->
  <text x="330" y="360" font-size="14" font-weight="bold" fill="#111">Filter 2: 3 x 3 x 3</text>
  <text x="330" y="377" font-size="13" fill="#333">(Horizontal Edge Detector)</text>
  <g transform="translate(300,395)">
    <g transform="translate(24,0)">
      <rect width="90" height="90" fill="#f5cba7" stroke="#9c4a09" stroke-width="1.3"/>
      <path d="M30,0 V90 M60,0 V90 M0,30 H90 M0,60 H90" stroke="#9c4a09" stroke-width="0.6"/>
    </g>
    <g transform="translate(12,10)">
      <rect width="90" height="90" fill="#f5cba7" stroke="#9c4a09" stroke-width="1.3"/>
      <path d="M30,0 V90 M60,0 V90 M0,30 H90 M0,60 H90" stroke="#9c4a09" stroke-width="0.6"/>
    </g>
    <g transform="translate(0,20)">
      <rect width="90" height="90" fill="#f5cba7" stroke="#9c4a09" stroke-width="1.3"/>
      <path d="M30,0 V90 M60,0 V90 M0,30 H90 M0,60 H90" stroke="#9c4a09" stroke-width="0.6"/>
      <g font-size="13" fill="#5a2d0c" text-anchor="middle" font-weight="600">
        <text x="15" y="20">1</text><text x="45" y="20">2</text><text x="75" y="20">1</text>
        <text x="15" y="50">0</text><text x="45" y="50">0</text><text x="75" y="50">0</text>
        <text x="15" y="80">-1</text><text x="45" y="80">-2</text><text x="75" y="80">-1</text>
      </g>
    </g>
  </g>

  <!-- ============ "=" then feature maps ============ -->
  <text x="470" y="230" font-size="26" font-weight="bold" fill="#111">=</text>

  <!-- Feature map 1 (yellow, 30x30) -->
  <g transform="translate(510,80)">
    <rect width="170" height="170" fill="#f9e79f" stroke="#9a7d0a" stroke-width="1.3"/>
    <path d="M34,0 V170 M68,0 V170 M102,0 V170 M136,0 V170 M0,34 H170 M0,68 H170 M0,102 H170 M0,136 H170" stroke="#d4ac0d" stroke-width="0.5"/>
    <g font-size="11" fill="#4d3b00" text-anchor="middle">
      <text x="17" y="21">1</text><text x="51" y="21">4</text><text x="85" y="21">2</text><text x="119" y="21">3</text>
      <text x="17" y="55">9</text><text x="51" y="55">10</text><text x="85" y="55">17</text><text x="119" y="55">22</text>
      <text x="17" y="89">12</text><text x="51" y="89">27</text><text x="85" y="89">29</text><text x="119" y="89">38</text>
    </g>
    <!-- highlighted cell (1,1) -->
    <rect x="0" y="0" width="34" height="34" fill="#f7dc6f" stroke="#b7950b" stroke-width="2"/>
    <text x="185" y="20" font-size="12" fill="#111">1,1</text>
    <text x="90" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#111">30x30 feature map</text>
  </g>

  <!-- callout box for Output(1,1) formula -->
  <g transform="translate(700,15)">
    <text x="0" y="0" font-size="12.5" font-weight="bold" fill="#111">Output (1,1) =</text>
    <text x="0" y="17" font-size="12" fill="#333">sum(Red * Red_ker +</text>
    <text x="0" y="33" font-size="12" fill="#333">&#160;&#160;&#160;&#160;Grn * Grn_ker +</text>
    <text x="0" y="49" font-size="12" fill="#333">&#160;&#160;&#160;&#160;Blu * Blu_ker)</text>
    <text x="0" y="65" font-size="12" fill="#333">= scalar_val</text>
  </g>
  <line x1="700" y1="75" x2="620" y2="95" stroke="#333" stroke-width="1"/>

  <!-- Feature map 2 (orange, 30x30) -->
  <g transform="translate(510,300)">
    <rect width="170" height="170" fill="#f0b27a" stroke="#9c4a09" stroke-width="1.3"/>
    <path d="M34,0 V170 M68,0 V170 M102,0 V170 M136,0 V170 M0,34 H170 M0,68 H170 M0,102 H170 M0,136 H170" stroke="#ba6314" stroke-width="0.5"/>
    <g font-size="11" fill="#4a2200" text-anchor="middle">
      <text x="17" y="21">1</text><text x="51" y="21">2</text><text x="85" y="21">1</text>
      <text x="17" y="55">0</text><text x="51" y="55">0</text><text x="85" y="55">0</text>
      <text x="17" y="89">-1</text><text x="51" y="89">-2</text><text x="85" y="89">-1</text>
    </g>
    <text x="90" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#111">30x30 feature map</text>
  </g>

  <!-- convolve arrow to stacked output -->
  <line x1="700" y1="230" x2="770" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowVO)"/>
  <text x="735" y="215" text-anchor="middle" font-size="13" fill="#111">convolve</text>

  <!-- ============ FINAL STACKED OUTPUT (30x30x2) ============ -->
  <text x="960" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Output: 30 x 30 x 2</text>
  <g transform="translate(870,90)">
    <g transform="translate(20,0)">
      <polygon points="0,150 130,150 155,125 155,-25 25,-25 0,0" fill="#f0b27a" stroke="#9c4a09" stroke-width="1.3"/>
      <polygon points="0,0 25,-25 155,-25 130,0" fill="#f5cba7" stroke="#9c4a09" stroke-width="1.3"/>
    </g>
    <g transform="translate(0,10)">
      <polygon points="0,150 130,150 155,125 155,-25 25,-25 0,0" fill="#f9e79f" stroke="#9a7d0a" stroke-width="1.3"/>
      <polygon points="0,0 25,-25 155,-25 130,0" fill="#fcf3cf" stroke="#9a7d0a" stroke-width="1.3"/>
      <path d="M26,-25 V125 M52,-25 V125 M78,-25 V125 M104,-25 V125 M130,-25 V125" stroke="#d4ac0d" stroke-width="0.4" transform="translate(0,0)"/>
      <path d="M0,0 H130 M0,25 H130 M0,50 H130 M0,75 H130 M0,100 H130 M0,125 H130" stroke="#d4ac0d" stroke-width="0.4"/>
    </g>
  </g>
  <text x="960" y="290" text-anchor="middle" font-size="13.5" fill="#111">Stride 1</text>
  <text x="960" y="308" text-anchor="middle" font-size="13.5" fill="#111">0 Padding</text>

  <text x="960" y="440" text-anchor="middle" font-size="13" font-style="italic" fill="#555">Two filters &#8594; two 30x30 feature maps &#8594; stacked into one 30x30x2 output volume.</text>
</svg>
