<svg viewBox="0 0 1080 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowZP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="540" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#111">VISUALIZING CONVOLUTIONAL PADDING: 10x10 IMAGE, 3x3 FILTER</text>

  <!-- ================= PANEL A: VALID CONVOLUTION ================= -->
  <text x="150" y="65" font-size="15" font-weight="bold" fill="#111">A) VALID CONVOLUTION (NO PADDING)</text>

  <!-- column labels 0-9 -->
  <g font-size="12" fill="#111" text-anchor="middle">
    <text x="70" y="85">0</text><text x="90" y="85">1</text><text x="110" y="85">2</text><text x="130" y="85">3</text>
    <text x="150" y="85">4</text><text x="170" y="85">5</text><text x="190" y="85">6</text><text x="210" y="85">7</text>
    <text x="230" y="85">8</text><text x="250" y="85">9</text>
  </g>
  <!-- row labels 0-10 -->
  <g font-size="12" fill="#111" text-anchor="end">
    <text x="55" y="104">0</text><text x="55" y="124">1</text><text x="55" y="144">2</text><text x="55" y="164">3</text>
    <text x="55" y="184">4</text><text x="55" y="204">5</text><text x="55" y="224">6</text><text x="55" y="244">7</text>
    <text x="55" y="264">8</text><text x="55" y="284">9</text><text x="55" y="300">10</text>
  </g>

  <!-- 10x10 base grid, light blue -->
  <rect x="60" y="94" width="200" height="200" fill="#a9cce3"/>
  <!-- orange filter 3x3 top-left -->
  <rect x="60" y="94" width="60" height="60" fill="#f5b041"/>
  <text x="90" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000">Filter</text>
  <text x="90" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000">3x3</text>
  <!-- grid lines -->
  <path d="M60,94 H260 M60,114 H260 M60,134 H260 M60,154 H260 M60,174 H260 M60,194 H260 M60,214 H260 M60,234 H260 M60,254 H260 M60,274 H260 M60,294 H260
           M60,94 V294 M80,94 V294 M100,94 V294 M120,94 V294 M140,94 V294 M160,94 V294 M180,94 V294 M200,94 V294 M220,94 V294 M240,94 V294 M260,94 V294"
        stroke="#5d6d7e" stroke-width="1"/>
  <!-- possible filter placement region (8x8) dashed red -->
  <rect x="60" y="94" width="160" height="160" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="185" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c0392b">Possible Filter</text>
  <text x="185" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c0392b">Placements</text>

  <!-- arrow to output A -->
  <line x1="270" y1="194" x2="320" y2="194" stroke="#333" stroke-width="2" marker-end="url(#arrowZP)"/>

  <!-- output 8x8 green -->
  <text x="400" y="190" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">Output: 8x8</text>
  <rect x="330" y="200" width="140" height="140" fill="#82c37f"/>
  <path d="M330,200 H470 M330,217.5 H470 M330,235 H470 M330,252.5 H470 M330,270 H470 M330,287.5 H470 M330,305 H470 M330,322.5 H470 M330,340 H470
           M330,200 V340 M347.5,200 V340 M365,200 V340 M382.5,200 V340 M400,200 V340 M417.5,200 V340 M435,200 V340 M452.5,200 V340 M470,200 V340"
        stroke="#4c7a49" stroke-width="1"/>
  <text x="400" y="358" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">Output: 8x8</text>

  <text x="185" y="335" text-anchor="middle" font-size="15" fill="#111">(10-3+1) x (10-3+1) = 8x8</text>

  <!-- ================= PANEL B: SAME CONVOLUTION ================= -->
  <text x="700" y="65" font-size="15" font-weight="bold" fill="#111">B) SAME CONVOLUTION (WITH ZERO PADDING)</text>

  <!-- axis labels -1..10 (12 marks) -->
  <g font-size="11.5" fill="#111" text-anchor="middle">
    <text x="537" y="85">-1</text><text x="557" y="85">0</text><text x="577" y="85">1</text><text x="597" y="85">2</text>
    <text x="617" y="85">3</text><text x="637" y="85">4</text><text x="657" y="85">5</text><text x="677" y="85">6</text>
    <text x="697" y="85">7</text><text x="717" y="85">8</text><text x="737" y="85">9</text><text x="757" y="85">10</text>
  </g>
  <g font-size="11.5" fill="#111" text-anchor="end">
    <text x="528" y="103">-1</text><text x="528" y="123">0</text><text x="528" y="143">1</text><text x="528" y="163">2</text>
    <text x="528" y="183">3</text><text x="528" y="203">4</text><text x="528" y="223">5</text><text x="528" y="243">6</text>
    <text x="528" y="263">7</text><text x="528" y="283">8</text><text x="528" y="303">9</text><text x="528" y="323">10</text>
  </g>

  <!-- outer gray padding ring (12x12) -->
  <rect x="530" y="94" width="240" height="240" fill="#909497"/>
  <!-- inner 10x10 light blue (the real image) -->
  <rect x="550" y="114" width="200" height="200" fill="#a9cce3"/>
  <text x="650" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">10x10</text>

  <!-- zero labels around the padding ring (sampled) -->
  <g font-size="10" fill="#222" text-anchor="middle">
    <text x="540" y="107">0</text><text x="560" y="107">0</text><text x="580" y="107">0</text><text x="600" y="107">0</text>
    <text x="620" y="107">0</text><text x="640" y="107">0</text><text x="660" y="107">0</text><text x="680" y="107">0</text>
    <text x="700" y="107">0</text><text x="720" y="107">0</text><text x="740" y="107">0</text><text x="760" y="107">0</text>
    <text x="540" y="325">0</text><text x="560" y="325">0</text><text x="580" y="325">0</text><text x="600" y="325">0</text>
    <text x="620" y="325">0</text><text x="640" y="325">0</text><text x="660" y="325">0</text><text x="680" y="325">0</text>
    <text x="700" y="325">0</text><text x="720" y="325">0</text><text x="740" y="325">0</text><text x="760" y="325">0</text>
    <text x="540" y="130">0</text><text x="540" y="150">0</text><text x="540" y="170">0</text><text x="540" y="190">0</text>
    <text x="540" y="210">0</text><text x="540" y="230">0</text><text x="540" y="250">0</text><text x="540" y="270">0</text>
    <text x="540" y="290">0</text><text x="540" y="310">0</text>
    <text x="760" y="130">0</text><text x="760" y="150">0</text><text x="760" y="170">0</text><text x="760" y="190">0</text>
    <text x="760" y="210">0</text><text x="760" y="230">0</text><text x="760" y="250">0</text><text x="760" y="270">0</text>
    <text x="760" y="290">0</text><text x="760" y="310">0</text>
  </g>

  <!-- inner grid lines -->
  <path d="M550,114 H750 M550,134 H750 M550,154 H750 M550,174 H750 M550,194 H750 M550,214 H750 M550,234 H750 M550,254 H750 M550,274 H750 M550,294 H750 M550,314 H750
           M550,114 V314 M570,114 V314 M590,114 V314 M610,114 V314 M630,114 V314 M650,114 V314 M670,114 V314 M690,114 V314 M710,114 V314 M730,114 V314 M750,114 V314"
        stroke="#5d6d7e" stroke-width="1"/>

  <!-- orange filter, overlapping padding + first real cell -->
  <rect x="537" y="101" width="60" height="60" fill="#f5b041" fill-opacity="0.92"/>
  <text x="567" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">Filter</text>
  <text x="567" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">3x3</text>

  <!-- arrow to output B -->
  <line x1="780" y1="214" x2="830" y2="214" stroke="#333" stroke-width="2" marker-end="url(#arrowZP)"/>

  <!-- output 10x10 light blue -->
  <text x="920" y="190" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">Output: 10x10</text>
  <rect x="840" y="200" width="180" height="180" fill="#a9cce3"/>
  <path d="M840,200 H1020 M840,218 H1020 M840,236 H1020 M840,254 H1020 M840,272 H1020 M840,290 H1020 M840,308 H1020 M840,326 H1020 M840,344 H1020 M840,362 H1020 M840,380 H1020
           M840,200 V380 M858,200 V380 M876,200 V380 M894,200 V380 M912,200 V380 M930,200 V380 M948,200 V380 M966,200 V380 M984,200 V380 M1002,200 V380 M1020,200 V380"
        stroke="#5d6d7e" stroke-width="1"/>
  <text x="930" y="398" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111">Output: 10x10</text>

  <text x="700" y="357" text-anchor="middle" font-size="15" fill="#111">(10-3+1+2x1) x (10-3+1+2x1) = 10x10</text>

  <!-- ================= LEGEND ================= -->
  <g transform="translate(240,540)">
    <rect x="0" y="0" width="24" height="18" fill="#a9cce3"/>
    <text x="30" y="14" font-size="14" fill="#111">Light Blue=Output</text>

    <rect x="220" y="0" width="24" height="18" fill="#909497"/>
    <text x="250" y="14" font-size="14" fill="#111">Gray=Zero-Padding</text>

    <rect x="450" y="0" width="24" height="18" fill="#f5b041"/>
    <text x="480" y="14" font-size="14" fill="#111">Orange=Filter Area</text>
  </g>
</svg>
