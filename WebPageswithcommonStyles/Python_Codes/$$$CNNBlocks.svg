<svg viewBox="0 0 1400 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowCB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- ============ INPUT: layered RGB face ============ -->
  <g transform="translate(40,140)">
    <text x="55" y="-70" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">32</text>
    <text x="-16" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">32</text>

    <!-- blue channel (back) -->
    <rect x="18" y="-18" width="110" height="130" fill="#1a3fae"/>
    <!-- green channel (middle) -->
    <rect x="9" y="-9" width="110" height="130" fill="#1e8449"/>
    <!-- red channel (front) with simple face -->
    <rect x="0" y="0" width="110" height="130" fill="#c0392b"/>
    <g transform="translate(55,60)" fill="none" stroke="#7b241c" stroke-width="2">
      <ellipse cx="0" cy="0" rx="38" ry="48"/>
      <ellipse cx="-14" cy="-8" rx="6" ry="4" fill="#7b241c" stroke="none"/>
      <ellipse cx="14" cy="-8" rx="6" ry="4" fill="#7b241c" stroke="none"/>
      <path d="M0,0 L-4,18 L4,18 Z"/>
      <path d="M-14,32 Q0,40 14,32"/>
    </g>

    <line x1="55" y1="65" x2="55" y2="95" stroke="#333" stroke-width="1"/>
    <rect x="50" y="90" width="10" height="10" fill="none" stroke="#333" stroke-width="1.3"/>
    <line x1="60" y1="95" x2="200" y2="30" stroke="#333" stroke-width="1"/>

    <text x="55" y="165" text-anchor="middle" font-size="13" fill="#111">convolve</text>
  </g>

  <!-- arrow input -> stack32 -->
  <line x1="165" y1="205" x2="205" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arrowCB)"/>

  <!-- ============ STACK 32 ============ -->
  <text x="270" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">32</text>
  <g transform="translate(215,90)">
    <g transform="translate(30,0)"><rect width="70" height="220" fill="#c9ccd1" stroke="#555"/></g>
    <g transform="translate(24,5)"><rect width="70" height="220" fill="#cfd2d6" stroke="#555"/></g>
    <g transform="translate(18,10)"><rect width="70" height="220" fill="#d6d8db" stroke="#555"/></g>
    <g transform="translate(12,15)"><rect width="70" height="220" fill="#dcdee0" stroke="#555"/></g>
    <g transform="translate(6,20)"><rect width="70" height="220" fill="#e3e4e5" stroke="#555"/></g>
    <g transform="translate(0,25)"><rect width="70" height="220" fill="#eceded" stroke="#555"/></g>
    <rect x="30" y="150" width="10" height="10" fill="none" stroke="#333" stroke-width="1.3"/>
  </g>
  <text x="270" y="345" text-anchor="middle" font-size="13" fill="#111">pool</text>

  <line x1="330" y1="205" x2="365" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arrowCB)"/>

  <!-- ============ STACK 16 ============ -->
  <text x="425" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">16</text>
  <g transform="translate(375,105)">
    <g transform="translate(22,0)"><rect width="55" height="190" fill="#c9ccd1" stroke="#555"/></g>
    <g transform="translate(16,5)"><rect width="55" height="190" fill="#d3d5d8" stroke="#555"/></g>
    <g transform="translate(10,10)"><rect width="55" height="190" fill="#dcdee0" stroke="#555"/></g>
    <g transform="translate(4,15)"><rect width="55" height="190" fill="#e6e7e8" stroke="#555"/></g>
    <g transform="translate(0,18)"><rect width="55" height="190" fill="#eceded" stroke="#555"/></g>
    <rect x="18" y="115" width="9" height="9" fill="none" stroke="#333" stroke-width="1.3"/>
  </g>
  <line x1="400" y1="228" x2="470" y2="245" stroke="#555" stroke-width="1"/>
  <text x="415" y="330" text-anchor="middle" font-size="13" fill="#111">convolve</text>

  <line x1="465" y1="205" x2="500" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arrowCB)"/>

  <!-- ============ STACK 8 (first) ============ -->
  <text x="550" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">8</text>
  <g transform="translate(505,120)">
    <g transform="translate(16,0)"><rect width="42" height="160" fill="#c9ccd1" stroke="#555"/></g>
    <g transform="translate(11,4)"><rect width="42" height="160" fill="#d6d8db" stroke="#555"/></g>
    <g transform="translate(6,8)"><rect width="42" height="160" fill="#e2e3e5" stroke="#555"/></g>
    <g transform="translate(0,12)"><rect width="42" height="160" fill="#eceded" stroke="#555"/></g>
    <rect x="13" y="95" width="8" height="8" fill="none" stroke="#333" stroke-width="1.2"/>
  </g>
  <line x1="470" y1="245" x2="513" y2="215" stroke="#555" stroke-width="1"/>
  <text x="540" y="310" text-anchor="middle" font-size="13" fill="#111">pool</text>

  <line x1="565" y1="205" x2="600" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arrowCB)"/>

  <!-- ============ STACK 8 (second, smaller footprint) ============ -->
  <text x="645" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">8</text>
  <g transform="translate(605,135)">
    <g transform="translate(12,0)"><rect width="32" height="130" fill="#c9ccd1" stroke="#555"/></g>
    <g transform="translate(8,3)"><rect width="32" height="130" fill="#d8dadd" stroke="#555"/></g>
    <g transform="translate(4,6)"><rect width="32" height="130" fill="#e6e7e8" stroke="#555"/></g>
    <g transform="translate(0,9)"><rect width="32" height="130" fill="#eceded" stroke="#555"/></g>
    <rect x="10" y="75" width="7" height="7" fill="none" stroke="#333" stroke-width="1.2"/>
  </g>
  <line x1="565" y1="220" x2="612" y2="205" stroke="#555" stroke-width="1"/>
  <text x="635" y="290" text-anchor="middle" font-size="13" fill="#111">convolve</text>

  <line x1="650" y1="205" x2="685" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arrowCB)"/>

  <!-- ============ STACK 4 ============ -->
  <text x="720" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">4</text>
  <g transform="translate(690,150)">
    <g transform="translate(8,0)"><rect width="24" height="100" fill="#c9ccd1" stroke="#555"/></g>
    <g transform="translate(5,3)"><rect width="24" height="100" fill="#dadcde" stroke="#555"/></g>
    <g transform="translate(2,6)"><rect width="24" height="100" fill="#e8e9ea" stroke="#555"/></g>
    <g transform="translate(0,8)"><rect width="24" height="100" fill="#eceded" stroke="#555"/></g>
  </g>
  <text x="720" y="280" text-anchor="middle" font-size="13" fill="#111">pool</text>

  <line x1="735" y1="205" x2="770" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arrowCB)"/>

  <!-- ============ FLATTEN -> DENSE 500 -> 2 ============ -->
  <g transform="translate(780,120)">
    <!-- tiny flattened column of squares -->
    <g transform="translate(0,60)">
      <rect x="0" y="0" width="14" height="14" fill="#eceded" stroke="#555"/>
      <rect x="0" y="16" width="14" height="14" fill="#dcdee0" stroke="#555"/>
      <rect x="0" y="32" width="14" height="14" fill="#cfd2d6" stroke="#555"/>
      <rect x="0" y="48" width="14" height="14" fill="#c9ccd1" stroke="#555"/>
    </g>
    <text x="7" y="145" text-anchor="middle" font-size="13" fill="#111">flatten</text>

    <!-- wide trapezoid: 500 -->
    <polygon points="40,0 120,40 120,150 40,190" fill="#bfc9ca" stroke="#555" stroke-width="1.3"/>
    <text x="80" y="-10" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">500</text>

    <line x1="120" y1="60" x2="170" y2="75" stroke="#555" stroke-width="2" marker-end="url(#arrowCB)"/>

    <!-- narrow trapezoid: 2 (output) -->
    <polygon points="180,65 205,72 205,105 180,112" fill="#a4b0b3" stroke="#555" stroke-width="1.3"/>
    <text x="192" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">2</text>
  </g>

  <text x="700" y="480" text-anchor="middle" font-size="13" font-style="italic" fill="#555">
    Alternating convolution and pooling shrink spatial size while deepening features, ending in a flatten &#8594; dense (500) &#8594; output (2) classifier.
  </text>
</svg>
