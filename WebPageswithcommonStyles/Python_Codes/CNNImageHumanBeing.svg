<svg viewBox="0 0 1360 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- ============ TOP: HUMAN BEING ============ -->
  <ellipse cx="690" cy="40" rx="95" ry="26" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="690" y="46" text-anchor="middle" font-size="15" font-weight="600" fill="#111">HUMAN BEING</text>

  <!-- lines: oval -> 5 part boxes -->
  <g stroke="#333" stroke-width="1">
    <line x1="640" y1="60" x2="260" y2="110"/>
    <line x1="665" y1="64" x2="490" y2="110"/>
    <line x1="690" y1="66" x2="720" y2="110"/>
    <line x1="715" y1="64" x2="950" y2="110"/>
    <line x1="740" y1="60" x2="1180" y2="110"/>
  </g>

  <!-- ============ ROW OF 5 PART BOXES: ear, eye, nose, mouth, ear ============ -->
  <!-- Ear (left) -->
  <g transform="translate(230,110)">
    <rect width="60" height="55" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <path d="M40,10 Q52,20 48,35 Q45,45 34,42 Q40,32 32,25 Q28,15 40,10 Z" fill="#f3d9c4" stroke="#7b4a2b" stroke-width="1.3"/>
  </g>
  <!-- Eye -->
  <g transform="translate(460,110)">
    <rect width="60" height="55" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <path d="M10,28 Q30,10 50,28 Q30,46 10,28 Z" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <circle cx="30" cy="28" r="8" fill="#3b3b3b"/>
  </g>
  <!-- Nose -->
  <g transform="translate(690,110)">
    <rect width="60" height="55" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <path d="M32,8 Q26,28 20,38 Q30,44 40,38 Q34,28 32,8 Z" fill="#f3d9c4" stroke="#7b4a2b" stroke-width="1.3"/>
  </g>
  <!-- Mouth -->
  <g transform="translate(920,110)">
    <rect width="60" height="55" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <path d="M10,26 Q30,18 50,26 Q30,40 10,26 Z" fill="#c0392b" stroke="#7b241c" stroke-width="1.3"/>
    <path d="M10,26 Q30,30 50,26" fill="none" stroke="#7b241c" stroke-width="1"/>
  </g>
  <!-- Ear (right) -->
  <g transform="translate(1150,110)">
    <rect width="60" height="55" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <path d="M20,10 Q8,20 12,35 Q15,45 26,42 Q20,32 28,25 Q32,15 20,10 Z" fill="#f3d9c4" stroke="#7b4a2b" stroke-width="1.3"/>
  </g>

  <!-- ============ CROSSING LINES: parts -> primitives ============ -->
  <g stroke="#333" stroke-width="0.8">
    <!-- part0 (ear) -> prim 0,1,2 -->
    <line x1="260" y1="165" x2="64" y2="230"/>
    <line x1="260" y1="165" x2="165" y2="230"/>
    <line x1="260" y1="165" x2="266" y2="230"/>
    <!-- part1 (eye) -> prim 2,3,4,5 -->
    <line x1="490" y1="165" x2="266" y2="230"/>
    <line x1="490" y1="165" x2="367" y2="230"/>
    <line x1="490" y1="165" x2="468" y2="230"/>
    <line x1="490" y1="165" x2="569" y2="230"/>
    <!-- part2 (nose) -> prim 5,6,7 -->
    <line x1="720" y1="165" x2="569" y2="230"/>
    <line x1="720" y1="165" x2="670" y2="230"/>
    <line x1="720" y1="165" x2="771" y2="230"/>
    <!-- part3 (mouth) -> prim 7,8,9,10 -->
    <line x1="950" y1="165" x2="771" y2="230"/>
    <line x1="950" y1="165" x2="872" y2="230"/>
    <line x1="950" y1="165" x2="973" y2="230"/>
    <line x1="950" y1="165" x2="1074" y2="230"/>
    <!-- part4 (ear) -> prim 10,11,12 -->
    <line x1="1180" y1="165" x2="1074" y2="230"/>
    <line x1="1180" y1="165" x2="1175" y2="230"/>
    <line x1="1180" y1="165" x2="1276" y2="230"/>
  </g>

  <!-- ============ ROW OF 13 PRIMITIVE BOXES ============ -->
  <!-- box 1: shallow arc -->
  <g transform="translate(40,230)"><rect width="48" height="48" fill="#fff" stroke="#333" stroke-width="1.3"/><path d="M8,18 Q24,34 40,18" fill="none" stroke="#333" stroke-width="2"/></g>
  <!-- box 2: deeper arc -->
  <g transform="translate(141,230)"><rect width="48" height="48" fill="#fff" stroke="#333" stroke-width="1.3"/><path d="M8,14 Q24,38 40,14" fill="none" stroke="#333" stroke-width="2"/></g>
  <!-- box 3: arc variant -->
  <g transform="translate(242,230)"><rect width="48" height="48" fill="#fff" stroke="#333" stroke-width="1.3"/><path d="M10,30 Q24,10 38,30" fill="none" stroke="#333" stroke-width="2"/></g>
  <!-- box 4: arc variant -->
  <g transform="translate(343,230)"><rect width="48" height="48" fill="#fff" stroke="#333" stroke-width="1.3"/><path d="M10,12 Q24,32 38,12" fill="none" stroke="#333" stroke-width="2"/></g>
  <!-- box 5: diagonal line -->
  <g transform="translate(444,230)"><rect width="48" height="48" fill="#fff" stroke="#333" stroke-width="1.3"/><line x1="14" y1="38" x2="34" y2="10" stroke="#333" stroke-width="2.2"/></g>
  <!-- box 6: curve ( -->
  <g transform="translate(545,230)"><rect width="48" height="48" fill="#fff" stroke="#333" stroke-width="1.3"/><path d="M28,8 Q14,24 28,40" fill="none" stroke="#333" stroke-width="2.2"/></g>
  <!-- box 7: curve variant -->
  <g transform="translate(646,230)"><rect width="48" height="48" fill="#fff" stroke="#333" stroke-width="1.3"/><path d="M18,10 Q10,24 20,34 Q28,40 34,34" fill="none" stroke="#333" stroke-width="1.8"/></g>
  <!-- box 8: big eye oval -->
  <g transform="translate(747,230)"><rect width="48" height="48" fill="#fff" stroke="#333" stroke-width="1.3"/><ellipse cx="24" cy="24" rx="16" ry="11" fill="#3b3b3b"/></g>
  <!-- box 9: small eye dot -->
  <g transform="translate(848,230)"><rect width="48" height="48" fill="#fff" stroke="#333" stroke-width="1.3"/><ellipse cx="24" cy="24" rx="9" ry="6" fill="#3b3b3b"/></g>
  <!-- box 10: angle left -->
  <g transform="translate(949,230)"><rect width="48" height="48" fill="#fff" stroke="#333" stroke-width="1.3"/><path d="M32,10 L14,24 L32,38" fill="none" stroke="#333" stroke-width="2.2"/></g>
  <!-- box 11: angle right -->
  <g transform="translate(1050,230)"><rect width="48" height="48" fill="#fff" stroke="#333" stroke-width="1.3"/><path d="M16,10 L34,24 L16,38" fill="none" stroke="#333" stroke-width="2.2"/></g>
  <!-- box 12: curve ( -->
  <g transform="translate(1151,230)"><rect width="48" height="48" fill="#fff" stroke="#333" stroke-width="1.3"/><path d="M30,8 Q16,24 30,40" fill="none" stroke="#333" stroke-width="2.2"/></g>
  <!-- box 13: curve ) -->
  <g transform="translate(1252,230)"><rect width="48" height="48" fill="#fff" stroke="#333" stroke-width="1.3"/><path d="M18,8 Q32,24 18,40" fill="none" stroke="#333" stroke-width="2.2"/></g>

  <!-- ============ FAN LINES: person -> all 13 primitives ============ -->
  <g stroke="#333" stroke-width="0.6">
    <line x1="690" y1="360" x2="64" y2="278"/>
    <line x1="690" y1="360" x2="165" y2="278"/>
    <line x1="690" y1="360" x2="266" y2="278"/>
    <line x1="690" y1="360" x2="367" y2="278"/>
    <line x1="690" y1="360" x2="468" y2="278"/>
    <line x1="690" y1="360" x2="569" y2="278"/>
    <line x1="690" y1="360" x2="670" y2="278"/>
    <line x1="690" y1="360" x2="771" y2="278"/>
    <line x1="690" y1="360" x2="872" y2="278"/>
    <line x1="690" y1="360" x2="973" y2="278"/>
    <line x1="690" y1="360" x2="1074" y2="278"/>
    <line x1="690" y1="360" x2="1175" y2="278"/>
    <line x1="690" y1="360" x2="1276" y2="278"/>
  </g>

  <!-- ============ BOTTOM: viewer / person icon ============ -->
  <g transform="translate(690,400)">
    <circle cx="0" cy="0" r="34" fill="#f3d9c4" stroke="#7b4a2b" stroke-width="1.5"/>
    <path d="M-34,-6 Q-30,-38 0,-38 Q30,-38 34,-6 Q20,-20 0,-20 Q-20,-20 -34,-6 Z" fill="#6b4226" stroke="#4a2c17" stroke-width="1"/>
    <circle cx="-12" cy="0" r="3.5" fill="#3b3b3b"/>
    <circle cx="12" cy="0" r="3.5" fill="#3b3b3b"/>
    <path d="M-10,14 Q0,20 10,14" fill="none" stroke="#7b4a2b" stroke-width="1.8"/>
  </g>

</svg>
