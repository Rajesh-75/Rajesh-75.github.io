<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>

  <text x="490" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">U-Net: Encoder-Decoder with Skip Connections</text>
  <text x="490" y="50" text-anchor="middle" font-size="12" fill="#64748b">Encoder (left, downsampling) &#8212; Bottleneck (bottom) &#8212; Decoder (right, upsampling)</text>

  <!-- ===================== ENCODER PATH ===================== -->
  <!-- Level 0 -->
  <rect x="40" y="76" width="140" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">64 ch</text>
  <text x="110" y="112" text-anchor="middle" font-size="10" fill="#1e3a8a">572&#215;572</text>

  <path d="M110,122 L130,152" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray2)"/>
  <text x="145" y="140" font-size="10" fill="#475569">pool /2</text>

  <!-- Level 1 -->
  <rect x="120" y="154" width="122" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="181" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">128 ch</text>
  <text x="181" y="188" text-anchor="middle" font-size="10" fill="#1e3a8a">284&#215;284</text>

  <path d="M181,196 L200,226" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray2)"/>
  <text x="215" y="214" font-size="10" fill="#475569">pool /2</text>

  <!-- Level 2 -->
  <rect x="190" y="228" width="106" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="243" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">256 ch</text>
  <text x="243" y="260" text-anchor="middle" font-size="9.5" fill="#1e3a8a">140&#215;140</text>

  <path d="M243,266 L262,296" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray2)"/>
  <text x="277" y="284" font-size="10" fill="#475569">pool /2</text>

  <!-- Level 3 -->
  <rect x="252" y="298" width="92" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="298" y="314" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">512 ch</text>
  <text x="298" y="327" text-anchor="middle" font-size="9" fill="#1e3a8a">68&#215;68</text>

  <path d="M298,332 L318,362" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray2)"/>
  <text x="333" y="350" font-size="10" fill="#475569">pool /2</text>

  <!-- ===================== BOTTLENECK ===================== -->
  <rect x="428" y="364" width="84" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="470" y="380" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4c1d95">1024 ch</text>
  <text x="470" y="393" text-anchor="middle" font-size="9" fill="#4c1d95">32&#215;32</text>
  <text x="470" y="415" text-anchor="middle" font-size="10" font-style="italic" fill="#64748b">bottleneck</text>

  <!-- ===================== DECODER PATH ===================== -->
  <path d="M512,376 L556,346" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray2)"/>
  <text x="500" y="345" font-size="10" fill="#475569">up-conv &#215;2</text>

  <!-- Level 3' -->
  <rect x="558" y="298" width="92" height="34" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="604" y="314" text-anchor="middle" font-size="10.5" font-weight="700" fill="#831843">512 ch</text>
  <text x="604" y="327" text-anchor="middle" font-size="9" fill="#831843">64&#215;64</text>

  <path d="M650,308 L688,278" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray2)"/>
  <text x="640" y="278" font-size="10" fill="#475569">up-conv &#215;2</text>

  <!-- Level 2' -->
  <rect x="590" y="228" width="106" height="38" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="643" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#831843">256 ch</text>
  <text x="643" y="260" text-anchor="middle" font-size="9.5" fill="#831843">136&#215;136</text>

  <path d="M696,246 L734,216" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray2)"/>
  <text x="685" y="216" font-size="10" fill="#475569">up-conv &#215;2</text>

  <!-- Level 1' -->
  <rect x="614" y="154" width="122" height="42" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="675" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#831843">128 ch</text>
  <text x="675" y="188" text-anchor="middle" font-size="10" fill="#831843">280&#215;280</text>

  <path d="M736,166 L774,136" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray2)"/>
  <text x="722" y="136" font-size="10" fill="#475569">up-conv &#215;2</text>

  <!-- Level 0' -->
  <rect x="768" y="76" width="140" height="46" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="838" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#831843">64 ch</text>
  <text x="838" y="112" text-anchor="middle" font-size="10" fill="#831843">568&#215;568</text>

  <path d="M908,99 L935,99" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray2)"/>
  <rect x="937" y="80" width="0" height="0"/>

  <!-- final 1x1 conv + output, placed just below title on far right -->
  <rect x="855" y="150" width="115" height="36" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="912" y="172" text-anchor="middle" font-size="11" fill="#713f12">1&#215;1 Conv &#8594; K classes</text>
  <path d="M925,122 L912,148" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray2)"/>

  <!-- ===================== SKIP CONNECTIONS (dashed, concatenate) ===================== -->
  <path d="M180,99 L768,99" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowTealDash)"/>
  <path d="M242,175 L614,175" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowTealDash)"/>
  <path d="M296,247 L590,247" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowTealDash)"/>
  <path d="M344,315 L558,315" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowTealDash)"/>
  <text x="490" y="90" text-anchor="middle" font-size="10.5" fill="#0f766e" font-style="italic">skip connection (concatenate, not add)</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="40" y="450" width="900" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="475" font-size="13" font-weight="700" fill="#1e293b">Reading the Diagram</text>

  <line x1="60" y1="495" x2="95" y2="495" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray2)"/>
  <text x="102" y="499" font-size="11" fill="#334155">Solid arrows: Conv+Pool going down (encoder), Up-conv (transposed conv) going up (decoder)</text>

  <line x1="60" y1="516" x2="95" y2="516" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowTealDash)"/>
  <text x="102" y="520" font-size="11" fill="#334155">Dashed teal arrows: skip connections &#8212; the encoder feature map is <tspan font-weight="700">concatenated</tspan> onto the decoder map, restoring fine spatial detail lost during pooling</text>

  <rect x="60" y="530" width="16" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="102" y="541" font-size="11" fill="#334155">Bottleneck: smallest spatial size, largest channel depth &#8212; the most compressed representation of the image</text>

  <text x="60" y="559" font-size="11" fill="#334155">Contrast with ResNet's skip connection: U-Net <tspan font-weight="700">concatenates</tspan> (channels stack side by side); ResNet <tspan font-weight="700">adds</tspan> (same-shaped tensors summed).</text>

  <defs>
    <marker id="arrowGray2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arrowTealDash" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0d9488"/>
    </marker>
  </defs>
</svg>
